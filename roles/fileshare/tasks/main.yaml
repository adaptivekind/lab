# SFTP based filesharing store
- name: Add sftp_users group
  ansible.builtin.group:
    name: sftp_users
    state: present

- name: Add fileshare user
  ansible.builtin.user:
    name: "{{ item.name }}"
    comment: "{{ item.name }}"
    group: sftp_users
  loop: "{{ fileshare.users }}"

- name: Create parent data directory for users fileshare
  ansible.builtin.file:
    path: /data/users/
    state: directory
    owner: root
    mode: "755"

- name: Create data directory for users fileshare
  ansible.builtin.file:
    path: /data/users/{{ item.name }}/
    state: directory
    owner: root
    mode: "755"
  loop: "{{ fileshare.users }}"

- name: Create store data directory for users fileshare
  ansible.builtin.file:
    path: /data/users/{{ item.name }}/store
    state: directory
    owner: "{{ item.name }}"
    mode: "700"
  loop: "{{ fileshare.users }}"

- name: Set authorized key taken from file
  ansible.posix.authorized_key:
    user: "{{ item.name }}"
    state: present
    key: "{{ item.ssh_key }}"
  loop: "{{ fileshare.users }}"

- name: Create sshd config for users
  copy:
    dest: /etc/ssh/sshd_config.d/{{ item.name }}_sshd.conf
    mode: "644"
    content: |
      Match User {{ item.name }}
      PasswordAuthentication yes
      ChrootDirectory /data/users/%u
      ForceCommand internal-sftp -u 022
  loop: "{{ fileshare.users }}"

- name: Restart sshd
  ansible.builtin.service:
    name: sshd
    state: reloaded
